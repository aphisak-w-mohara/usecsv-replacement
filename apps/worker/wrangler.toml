name = "evo-csv"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# `local` relaxes cookie security (drops Secure + the __Host- prefix) so the
# session cookie works over plain http on the dev server. Deployed envs set
# this to "staging"/"production" via `wrangler deploy --var` or a per-env block.
ENVIRONMENT = "local"
GOOGLE_CLIENT_ID = "REPLACE"
GOOGLE_REDIRECT_URI = "http://localhost:8787/api/auth/google/callback"
APP_BASE_URL = "http://localhost:5173"
# GOOGLE_CLIENT_SECRET is a real secret in deployed envs — set it with
#   wrangler secret put GOOGLE_CLIENT_SECRET
# A deployed secret shadows this var, so this obviously-fake value only ever
# applies to local dev + the vitest pool (which reads [vars]).
GOOGLE_CLIENT_SECRET = "test-secret"

[[d1_databases]]
binding = "DB"
database_name = "evo-csv-dev"
database_id = "21b06102-dd71-4e58-a8ce-19118a48d472"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "evo-csv-uploads"

# Opaque sessions (session:<token>) and the short-lived OAuth PKCE state
# (oauthstate:<state>) both live here. Miniflare simulates KV in dev + tests,
# so the placeholder id below is fine locally. Before deploy, the operator runs
#   wrangler kv namespace create SESSIONS
# and pastes the returned id over REPLACE_WITH_KV_ID.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_ID"

[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "webhook-dispatch"

# We manage our own attempt counting + backoff via re-enqueue, so the platform
# retry is disabled (max_retries = 0) and batches are processed one at a time.
[[queues.consumers]]
queue = "webhook-dispatch"
max_batch_size = 1
max_retries = 0
