name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR branch (e.g. force-pushes). Never cancel
# a push-to-main run — that would let a broken commit land with no failing check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build, typecheck, lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Worker tests run under @cloudflare/vitest-pool-workers, which reads
      # apps/worker/wrangler.toml's [assets] dir (../web/dist). That directory
      # MUST exist before the worker tests run, so build the web app first.
      - name: Build web (required before worker tests — assets dir dependency)
        run: pnpm --filter @evo-csv/web build

      - name: Typecheck worker
        run: pnpm --filter @evo-csv/worker typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (worker + web)
        run: pnpm test

      - name: Build (all workspaces)
        run: pnpm build
